services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: labtrack
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtrack -d labtrack"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://labtrack:${POSTGRES_PASSWORD}@db:5432/labtrack?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      APP_TIME_ZONE_OFFSET: ${APP_TIME_ZONE_OFFSET:-+08:00}
      UPLOAD_DIR: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - upload_data:/app/storage
volumes:
  postgres_data:
  upload_data:
